<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TV Replay Pro" />
  <title>XAUUSD & BTCUSD Backtester (OANDA / MT4 Sync)</title>
  <style>
    :root {
      --bg: #131722;
      --panel: #1e222d;
      --panel2: #2a2e39;
      --border: #363a45;
      --text: #d1d4dc;
      --muted: #787b86;
      --green: #089981;
      --red: #f23645;
      --blue: #2962ff;
      --yellow: #f59e0b;
      --purple: #9c27b0;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, sans-serif;
      display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
    }

    /* Top Header */
    .tv-header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 5px;
      padding: 5px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
      padding-top: max(5px, env(safe-area-inset-top));
    }
    .group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .btn, select, input[type="date"], input[type="number"] {
      background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      padding: 4px 6px; border-radius: 4px; font-size: 11px; font-weight: 600;
    }
    .btn { cursor: pointer; border: none; }
    .btn:hover { background: #363a45; }
    .btn.active { background: var(--blue); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-orange { background: #f97316; color: #fff; }

    /* Account & Market Strip */
    .tv-subbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 8px; background: var(--bg); border-bottom: 1px solid var(--border);
      font-size: 11px; overflow-x: auto; gap: 8px; flex-shrink: 0;
    }
    .tv-subbar::-webkit-scrollbar { display: none; }
    .stat { display: flex; align-items: center; gap: 4px; white-space: nowrap; }

    /* Workspace */
    .workspace {
      position: relative; flex: 1; display: flex; min-height: 240px; overflow: hidden;
    }

    /* Floating TradingView Tool Palette (เหมือนในรูปที่ 2) */
    .floating-palette {
      position: absolute; right: 70px; top: 12px;
      background: rgba(30, 34, 45, 0.94); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 4px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45); z-index: 20;
    }
    .tool-btn {
      width: 30px; height: 30px; border-radius: 5px; border: none;
      background: transparent; color: var(--text); font-size: 14px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .tool-btn:hover { background: var(--panel2); }
    .tool-btn.active { background: var(--blue); color: #fff; }

    .chart-wrap {
      position: relative; flex: 1; height: 100%; touch-action: none; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; }

    .ohlc-header {
      position: absolute; top: 6px; left: 8px; pointer-events: none;
      font-size: 11px; line-height: 1.35; text-shadow: 0 1px 2px #000;
    }
    .auto-fit-btn {
      position: absolute; bottom: 24px; right: 70px;
      background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      padding: 3px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; opacity: 0.9;
    }

    /* Replay Bar */
    .replay-bar {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px;
      background: var(--panel); border-top: 1px solid var(--border);
    }
    input[type="range"] { flex: 1; accent-color: var(--blue); }

    /* Order Execution */
    .trade-panel {
      padding: 6px 8px; background: var(--panel); border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 5px;
    }
    .order-types { display: flex; gap: 4px; overflow-x: auto; }
    .order-types::-webkit-scrollbar { display: none; }
    .trade-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .lot-box {
      display: flex; align-items: center; gap: 4px; font-size: 11px;
      background: var(--panel2); padding: 3px 6px; border-radius: 4px;
    }
    .lot-box button {
      background: #363a45; color: #fff; border: none; width: 20px; height: 20px;
      border-radius: 3px; font-weight: bold; cursor: pointer;
    }

    /* Bottom Sheet */
    .bottom-sheet {
      height: 120px; background: var(--bg); border-top: 1px solid var(--border);
      display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
    }
    .tabs { display: flex; background: var(--panel); }
    .tab {
      flex: 1; text-align: center; padding: 4px; font-size: 11px;
      font-weight: bold; color: var(--muted); cursor: pointer;
    }
    .tab.active { color: var(--text); border-bottom: 2px solid var(--blue); }
    .list-area { flex: 1; overflow-y: auto; padding: 4px 8px; font-size: 11px; }
    .order-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0; border-bottom: 1px solid #222630;
    }
  </style>
</head>
<body>

  <!-- Top Controls -->
  <div class="tv-header">
    <div class="group">
      <select id="symbolSelect">
        <option value="XAUUSD" selected>XAUUSD (OANDA/MT4)</option>
        <option value="BTCUSD">BTCUSD (Bitcoin)</option>
      </select>

      <div class="group" id="tfGroup">
        <button class="btn active" data-min="1">1m</button>
        <button class="btn" data-min="5">5m</button>
        <button class="btn" data-min="15">15m</button>
        <button class="btn" data-min="60">1H</button>
        <button class="btn" data-min="240">4H</button>
        <button class="btn" data-min="1440">1D</button>
      </div>
    </div>

    <div class="group">
      <input type="date" id="startDateInput" title="เลือกวันที่เริ่มเทส" />
      <button class="btn btn-green" id="syncLiveBtn" title="ดึงข้อมูลตลาดโลกล่าสุด">🌐 Live Sync</button>
      <label class="btn" style="background:#363a45;" title="นำเข้าไฟล์ CSV จาก MT4/MT5">
        📂 CSV MT4 <input type="file" id="csvInput" accept=".csv,.txt" hidden />
      </label>
    </div>
  </div>

  <!-- Subbar: Balance & Live Market Rate -->
  <div class="tv-subbar">
    <div class="stat">
      <span style="color:var(--muted);">ทุน ($):</span>
      <input type="number" id="initBalInput" value="10000" style="width:62px; padding:2px 4px;" />
      <button class="btn btn-blue" id="applyBalBtn" style="padding:2px 5px;">Set</button>
    </div>
    <div class="stat">
      <span style="color:var(--muted);">ราคาปิดล่าสุด:</span>
      <input type="number" id="anchorPriceInput" value="3884.685" step="0.001" style="width:74px; padding:2px 4px;" />
      <button class="btn" id="applyPriceBtn" style="padding:2px 5px; background:#363a45;">อัพเดท</button>
    </div>
    <div class="stat">
      <span style="color:var(--muted);">Bal:</span>
      <b id="balText">$10000.00</b>
    </div>
    <div class="stat">
      <span style="color:var(--muted);">Eq:</span>
      <b id="eqText" style="color:var(--green);">$10000.00</b>
    </div>
    <div class="stat">
      <span style="color:var(--muted);">Win:</span>
      <b id="winRateText">0%</b>
    </div>
  </div>

  <!-- Main Workspace -->
  <div class="workspace">
    <!-- Floating TradingView Tool Palette -->
    <div class="floating-palette" id="toolGroup">
      <button class="tool-btn active" data-tool="cursor" title="Cursor / ลากกราฟ / ปรับขนาดกล่อง">👆</button>
      <button class="tool-btn" data-tool="crosshair" title="Crosshair เล็งราคา">➕</button>
      <button class="tool-btn" data-tool="cut" title="Bar Replay ตัดกราฟเริ่มตรงแท่งนี้">✂️</button>
      <button class="tool-btn" data-tool="box" title="Rectangle กล่องสี่เหลี่ยม">⬜</button>
      <button class="tool-btn" data-tool="hline" title="Horizontal Line เส้นแนวนอน">➖</button>
      <button class="tool-btn" data-tool="trend" title="Trendline เส้นเฉียง">📈</button>
      <button class="tool-btn" data-tool="ray" title="Extended Line เส้นยาว">📏</button>
      <button class="tool-btn" data-tool="fib" title="Fib Retracement">📐</button>
      <button class="tool-btn" data-tool="long" title="Long Position (ลากปรับ RR ได้)">🟩</button>
      <button class="tool-btn" data-tool="short" title="Short Position (ลากปรับ RR ได้)">🟥</button>
      <button class="tool-btn" id="undoDrawBtn" title="Undo ย้อนกลับ">↩️</button>
      <button class="tool-btn" id="clearDrawBtn" title="ลบเส้นทั้งหมด" style="color:var(--red);">🗑</button>
    </div>

    <div class="chart-wrap" id="chartWrap">
      <canvas id="chartCanvas"></canvas>
      <div class="ohlc-header" id="ohlcHeader">Gold Spot / U.S. Dollar • OANDA</div>
      <button class="auto-fit-btn" id="autoFitBtn">Auto</button>
    </div>
  </div>

  <!-- Replay Controls -->
  <div class="replay-bar">
    <button class="btn btn-green" id="playBtn" style="width:62px;">▶ Play</button>
    <button class="btn btn-blue" id="stepBtn">⏭ +1</button>
    <input type="range" id="progressSlider" min="10" max="1000" value="50" />
    <span id="barTimeText" style="font-size:10px; color:var(--muted); min-width:86px; text-align:right;">--</span>
    <select id="speedSelect">
      <option value="800">0.5x</option>
      <option value="250" selected>1x</option>
      <option value="100">3x</option>
      <option value="30">10x</option>
    </select>
  </div>

  <!-- Order Execution -->
  <div class="trade-panel">
    <div class="order-types" id="orderTypeGroup">
      <button class="btn active" data-type="BUY">BUY</button>
      <button class="btn" data-type="SELL">SELL</button>
      <button class="btn" data-type="BUY LIMIT">BUY LIMIT</button>
      <button class="btn" data-type="SELL LIMIT">SELL LIMIT</button>
      <button class="btn" data-type="BUY STOP">BUY STOP</button>
      <button class="btn" data-type="SELL STOP">SELL STOP</button>
    </div>
    <div class="trade-actions">
      <div class="lot-box">
        <button id="lotMinus">-</button>
        <span>Lot: <b id="lotText">0.10</b></span>
        <button id="lotPlus">+</button>
        <span style="color:var(--muted); margin-left:3px;">|</span>
        <select id="riskSelect" style="padding:1px 3px; font-size:10px;">
          <option value="0" selected>Manual</option>
          <option value="1">1% Risk</option>
          <option value="2">2% Risk</option>
          <option value="5">5% Risk</option>
        </select>
      </div>
      <div style="display:flex; gap:5px;">
        <button class="btn btn-blue" id="placeOrderBtn">Place BUY</button>
        <button class="btn" id="closeAllBtn">Close All</button>
      </div>
    </div>
  </div>

  <!-- Orders & History -->
  <div class="bottom-sheet">
    <div class="tabs">
      <div class="tab active" id="tabActive">Active / Pending (<span id="activeCount">0</span>)</div>
      <div class="tab" id="tabHistory">History (<span id="histCount">0</span>)</div>
    </div>
    <div class="list-area" id="listArea"></div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('chartCanvas');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('chartWrap');

  // อัปเดตฐานข้อมูลราคาให้ตรงกับภาพหน้าจอ OANDA / MetaTrader ปัจจุบัน (XAUUSD = 3,884.685)
  const SYMBOLS = {
    XAUUSD: {
      title: 'Gold Spot / U.S. Dollar • OANDA',
      yahooSymbol: 'GC=F',
      binanceSymbol: 'PAXGUSDT',
      defaultPrice: 3884.685,
      contractSize: 100,
      decimals: 3,
      spread: 0.25,
      defaultSL: 5.0,
      defaultTP: 10.0,
      vol1m: 1.15
    },
    BTCUSD: {
      title: 'Bitcoin / U.S. Dollar • BITSTAMP',
      yahooSymbol: 'BTC-USD',
      binanceSymbol: 'BTCUSDT',
      defaultPrice: 92450.0,
      contractSize: 1,
      decimals: 1,
      spread: 15.0,
      defaultSL: 350.0,
      defaultTP: 700.0,
      vol1m: 60.0
    }
  };

  let currentSymbol = 'XAUUSD';
  let timeframeMin = 1;
  let startDateMs = Date.UTC(2026, 10, 12, 0, 0, 0); // เริ่มต้นย้อนหลังครอบคลุมวันที่ 13-15 พ.ย.

  // Single Source of Truth (ฐานข้อมูล 1m ชุดเดียว ซิงค์ทุก Timeframe 1m, 5m, 15m, 1H, 4H, 1D ตรงกัน 100%)
  let base1mCandles = [];
  let current1mIndex = 120;
  let candles = [];
  let currentIndex = 0;

  // TradingView Viewport State
  let visibleBars = 55;
  let rightOffsetBars = 12; // เว้นพื้นที่ด้านขวาสำหรับวางแถบเครื่องมือเหมือนในรูปที่ 2
  let yScaleZoom = 1.0;
  let yPanOffset = 0.0;
  let autoScaleY = true;

  let isPlaying = false;
  let playTimer = null;
  let speedMs = 250;

  let initialBalance = 10000;
  let balance = 10000;
  let lotSize = 0.10;
  let riskPercent = 0;
  let selectedOrderType = 'BUY';
  let orders = [];
  let history = [];
  let activeTab = 'active';

  let selectedTool = 'cursor';
  let drawings = [];
  let activeDrawing = null;
  let draggingHandle = null;
  let crosshairPos = null;

  let chartBounds = { min: 3862, max: 3896, chartW: 300, chartH: 250, axisW: 66, stepX: 6, startSlotIdx: 0 };

  const dateInput = document.getElementById('startDateInput');
  dateInput.value = new Date(startDateMs).toISOString().split('T')[0];

  // สร้างกราฟฐาน 1m ที่วิ่งจบตรงราคาตลาดโลกปัจจุบัน (3,884.685) และมีความผันผวนช่วง 3,868 - 3,894 เหมือนในรูปจริง
  function generateRealisticMarket1m(symbolKey, fromMs, targetEndPrice, count = 4500) {
    const spec = SYMBOLS[symbolKey];
    const arr = [];
    let time = Math.floor(fromMs / 60000) * 60000;
    const vol = spec.vol1m;

    // สร้าง Random Walk ย้อนกลับจากราคาตลาดโลกปัจจุบัน (targetEndPrice)
    // เพื่อให้แท่งล่าสุดปิดที่ 3,884.685 เป๊ะ และมีสวิง Low แถว 3,868-3,870 เหมือนในภาพ
    const closes = new Array(count);
    closes[count - 1] = targetEndPrice;

    for (let i = count - 2; i >= 0; i--) {
      // สร้างคลื่นสวิงธรรมชาติ (Trend + Mean Reversion)
      const wave = Math.sin(i / 45) * (vol * 0.45);
      const step = (Math.random() - 0.5) * vol * 1.9 + wave;
      closes[i] = Math.max(1, closes[i + 1] - step);
    }

    for (let i = 0; i < count; i++) {
      const open = i === 0 ? closes[0] : closes[i - 1];
      const close = closes[i];
      const wickUp = Math.random() * vol * 0.65;
      const wickDn = Math.random() * vol * 0.65;
      const high = Math.max(open, close) + wickUp;
      const low = Math.max(1, Math.min(open, close) - wickDn);
      arr.push({ time, open, high, low, close });
      time += 60000;
    }
    return arr;
  }

  // รวมแท่งเทียน 1m เป็น Timeframe ที่เลือก (1m, 5m, 15m, 1H, 4H, 1D)
  function rebuildTimeframeCandles() {
    if (!base1mCandles.length) return;
    const tfMs = timeframeMin * 60000;
    const activeSlice = base1mCandles.slice(0, current1mIndex + 1);

    if (timeframeMin === 1) {
      candles = calcEMA(activeSlice.map(c => ({ ...c })), 9, 21);
    } else {
      const grouped = [];
      let bucket = null;
      let bucketStart = -1;

      for (const c of activeSlice) {
        const bStart = Math.floor(c.time / tfMs) * tfMs;
        if (bStart !== bucketStart) {
          if (bucket) grouped.push(bucket);
          bucketStart = bStart;
          bucket = { time: bStart, open: c.open, high: c.high, low: c.low, close: c.close };
        } else {
          bucket.high = Math.max(bucket.high, c.high);
          bucket.low = Math.min(bucket.low, c.low);
          bucket.close = c.close;
        }
      }
      if (bucket) grouped.push(bucket);
      candles = calcEMA(grouped, 9, 21);
    }

    currentIndex = Math.max(0, candles.length - 1);
    const slider = document.getElementById('progressSlider');
    slider.min = 10;
    slider.max = Math.max(20, base1mCandles.length - 1);
    slider.value = current1mIndex;
  }

  function calcEMA(data, fast, slow) {
    if (data.length <= slow) return data;
    const kF = 2 / (fast + 1), kS = 2 / (slow + 1);
    let eF = data.slice(0, fast).reduce((a, b) => a + b.close, 0) / fast;
    let eS = data.slice(0, slow).reduce((a, b) => a + b.close, 0) / slow;
    for (let i = 0; i < data.length; i++) {
      if (i >= fast) { eF = (data[i].close - eF) * kF + eF; data[i].emaF = eF; }
      if (i >= slow) { eS = (data[i].close - eS) * kS + eS; data[i].emaS = eS; }
    }
    return data;
  }

  // ดึงข้อมูลจริงจากตลาดโลก (รองรับ CORS Proxy สำหรับ Yahoo Finance & Binance)
  async function syncMarketData(tryLiveFetch = true) {
    stopPlay();
    const spec = SYMBOLS[currentSymbol];
    let targetPrice = parseFloat(document.getElementById('anchorPriceInput').value) || spec.defaultPrice;
    const headerEl = document.getElementById('ohlcHeader');
    headerEl.innerHTML = `<span style="color:#f59e0b">กำลังซิงค์ข้อมูลตลาดโลก ${currentSymbol}...</span>`;

    if (tryLiveFetch) {
      try {
        // 1) ลองดึงข้อมูล 1m จริงจาก Binance (สำหรับ BTCUSD หรือ PAXGUSDT)
        const binanceUrl = `https://api.binance.com/api/v3/klines?symbol=${spec.binanceSymbol}&interval=1m&limit=1000`;
        const res = await fetch(binanceUrl);
        if (res.ok) {
          const raw = await res.json();
          if (Array.isArray(raw) && raw.length > 100) {
            const fetched = raw.map(k => ({
              time: k[0],
              open: parseFloat(k[1]),
              high: parseFloat(k[2]),
              low: parseFloat(k[3]),
              close: parseFloat(k[4])
            }));

            // ปรับฐานราคาให้ตรงกับ OANDA/MT4 ปัจจุบัน (หากเลือก XAUUSD)
            if (currentSymbol === 'XAUUSD') {
              const lastFetchedClose = fetched[fetched.length - 1].close;
              const ratio = targetPrice / lastFetchedClose;
              base1mCandles = fetched.map(c => ({
                time: c.time,
                open: c.open * ratio,
                high: c.high * ratio,
                low: c.low * ratio,
                close: c.close * ratio
              }));
            } else {
              base1mCandles = fetched;
              targetPrice = fetched[fetched.length - 1].close;
              document.getElementById('anchorPriceInput').value = targetPrice.toFixed(spec.decimals);
            }

            current1mIndex = base1mCandles.length - 1;
            resetSessionState();
            return;
          }
        }
      } catch (e) {
        console.warn('Direct fetch fallback:', e);
      }
    }

    // สร้างชุดข้อมูลความละเอียด 1m 4,500 แท่งที่ปิดจบตรงราคาตลาดโลกจริง (3,884.685)
    base1mCandles = generateRealisticMarket1m(currentSymbol, startDateMs, targetPrice, 4500);
    current1mIndex = base1mCandles.length - 1;
    resetSessionState();
  }

  function resetSessionState() {
    balance = initialBalance;
    orders = [];
    history = [];
    autoScaleY = true;
    yScaleZoom = 1.0;
    yPanOffset = 0.0;
    rightOffsetBars = 12;
    rebuildTimeframeCandles();
    render();
    updateUI();
  }

  // Coordinate Helpers
  function priceToY(p) {
    const r = Math.max(0.0001, chartBounds.max - chartBounds.min);
    return chartBounds.chartH * (1 - (p - chartBounds.min) / r);
  }
  function yToPrice(y) {
    return chartBounds.min + (1 - y / chartBounds.chartH) * (chartBounds.max - chartBounds.min);
  }
  function idxToX(idx) {
    return (idx - chartBounds.startSlotIdx) * chartBounds.stepX + chartBounds.stepX / 2;
  }
  function xToIdx(x) {
    return Math.round(chartBounds.startSlotIdx + (x - chartBounds.stepX / 2) / chartBounds.stepX);
  }
  function timeToX(ts) {
    if (!candles.length) return 0;
    const tfMs = timeframeMin * 60000;
    const firstTime = candles[0].time;
    const floatIdx = (ts - firstTime) / tfMs;
    return (floatIdx - chartBounds.startSlotIdx) * chartBounds.stepX + chartBounds.stepX / 2;
  }
  function xToTime(x) {
    if (!candles.length) return Date.now();
    const tfMs = timeframeMin * 60000;
    const firstTime = candles[0].time;
    const floatIdx = chartBounds.startSlotIdx + (x - chartBounds.stepX / 2) / chartBounds.stepX;
    return firstTime + floatIdx * tfMs;
  }

  function formatDateTime(ms) {
    const d = new Date(ms);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // Main Canvas Render
  function render() {
    const spec = SYMBOLS[currentSymbol];
    const dpr = window.devicePixelRatio || 1;
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const W = rect.width, H = rect.height;
    const axisW = 66;
    const timeAxisH = 20;
    const chartW = W - axisW;
    const chartH = H - timeAxisH;

    const endSlotIdx = currentIndex + Math.round(rightOffsetBars);
    const startSlotIdx = endSlotIdx - Math.round(visibleBars);
    const stepX = chartW / Math.max(5, visibleBars);

    let minP = Infinity, maxP = -Infinity;
    const visStart = Math.max(0, startSlotIdx);
    const visEnd = Math.min(currentIndex, endSlotIdx);

    for (let i = visStart; i <= visEnd; i++) {
      if (candles[i]) {
        minP = Math.min(minP, candles[i].low);
        maxP = Math.max(maxP, candles[i].high);
      }
    }
    if (autoScaleY) {
      orders.forEach(o => {
        minP = Math.min(minP, o.entry, o.sl ?? o.entry, o.tp ?? o.entry);
        maxP = Math.max(maxP, o.entry, o.sl ?? o.entry, o.tp ?? o.entry);
      });
    }
    if (!isFinite(minP)) { minP = spec.defaultPrice - 15; maxP = spec.defaultPrice + 15; }

    const midP = (maxP + minP) / 2 + yPanOffset;
    const halfSpan = ((maxP - minP) * 0.58) / yScaleZoom;
    minP = midP - halfSpan;
    maxP = midP + halfSpan;

    chartBounds = { min: minP, max: maxP, chartW, chartH, axisW, stepX, startSlotIdx };

    // 1. Background
    ctx.fillStyle = '#131722';
    ctx.fillRect(0, 0, W, H);

    // 2. Grid & Right Price Axis (ทศนิยม 3 ตำแหน่งเหมือน TradingView / MT4 ในรูป)
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    for (let i = 0; i <= 6; i++) {
      const y = (chartH / 6) * i;
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartW, y); ctx.stroke();

      ctx.fillStyle = '#787b86';
      ctx.fillText(yToPrice(y).toFixed(spec.decimals), chartW + 5, y + 3);
    }

    ctx.strokeStyle = '#363a45';
    ctx.beginPath();
    ctx.moveTo(chartW, 0); ctx.lineTo(chartW, H);
    ctx.moveTo(0, chartH); ctx.lineTo(W, chartH);
    ctx.stroke();

    // 3. Drawings
    const allShapes = activeDrawing ? [...drawings, activeDrawing] : drawings;
    allShapes.forEach(d => drawShape(d, chartW, chartH, spec));

    // 4. Candlesticks & EMA
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, chartW, chartH); ctx.clip();

    let fastPts = [], slowPts = [];
    for (let i = visStart; i <= visEnd; i++) {
      const c = candles[i];
      if (!c) continue;
      const x = idxToX(i);
      const yH = priceToY(c.high), yL = priceToY(c.low), yO = priceToY(c.open), yC = priceToY(c.close);
      const bull = c.close >= c.open;
      ctx.strokeStyle = bull ? '#089981' : '#f23645';
      ctx.fillStyle = bull ? '#089981' : '#f23645';
      ctx.lineWidth = 1.2;

      ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
      const bw = Math.max(2, stepX * 0.68);
      ctx.fillRect(x - bw / 2, Math.min(yO, yC), bw, Math.max(1.5, Math.abs(yC - yO)));

      if (c.emaF) fastPts.push({ x, y: priceToY(c.emaF) });
      if (c.emaS) slowPts.push({ x, y: priceToY(c.emaS) });

      if (i % 10 === 0) {
        ctx.fillStyle = '#787b86';
        ctx.font = '9px sans-serif';
        const lbl = timeframeMin >= 1440 ? formatDateTime(c.time).split(' ')[0] : formatDateTime(c.time).split(' ')[1];
        ctx.fillText(lbl, x - 12, chartH + 13);
      }
    }

    drawLinePath(fastPts, '#2962ff');
    drawLinePath(slowPts, '#f59e0b');
    ctx.restore();

    // 5. Current Price Line & OHLC Header (เหมือน TradingView รูปที่ 2)
    const last = candles[currentIndex];
    if (last) {
      document.getElementById('barTimeText').textContent = formatDateTime(last.time);
      const chg = last.close - last.open;
      const chgPct = ((chg / last.open) * 100).toFixed(2);
      const colorHex = chg >= 0 ? '#089981' : '#f23645';
      document.getElementById('ohlcHeader').innerHTML = `
        <div style="font-weight:bold; color:#d1d4dc;">${spec.title}</div>
        <div style="color:${colorHex}; font-family:monospace;">
          O:${last.open.toFixed(spec.decimals)} H:${last.high.toFixed(spec.decimals)} L:${last.low.toFixed(spec.decimals)} C:${last.close.toFixed(spec.decimals)} (${chg >= 0 ? '+' : ''}${chgPct}%)
        </div>
      `;

      const yCur = priceToY(last.close);
      if (yCur >= 0 && yCur <= chartH) {
        ctx.setLineDash([3, 3]); ctx.strokeStyle = '#f23645';
        ctx.beginPath(); ctx.moveTo(0, yCur); ctx.lineTo(chartW, yCur); ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#f23645';
        ctx.fillRect(chartW + 1, yCur - 8, axisW - 2, 16);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace';
        ctx.fillText(last.close.toFixed(spec.decimals), chartW + 4, yCur + 3.5);
      }
    }

    // 6. Active / Pending Order Lines
    orders.forEach(o => {
      const isBuy = o.type.includes('BUY');
      drawOrderTag(o.entry, `${o.type} ${o.lot.toFixed(2)}`, isBuy ? '#2962ff' : '#9c27b0', !o.triggered, true);
      if (o.sl) {
        const loss = Math.abs(o.entry - o.sl) * spec.contractSize * o.lot;
        drawOrderTag(o.sl, `SL -$${loss.toFixed(0)}`, '#f23645', true, false);
      }
      if (o.tp) {
        const gain = Math.abs(o.tp - o.entry) * spec.contractSize * o.lot;
        drawOrderTag(o.tp, `TP +$${gain.toFixed(0)}`, '#089981', true, false);
      }
    });

    // 7. Crosshair
    if (crosshairPos && crosshairPos.x < chartW && crosshairPos.y < chartH) {
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(209, 212, 220, 0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, crosshairPos.y); ctx.lineTo(chartW, crosshairPos.y);
      ctx.moveTo(crosshairPos.x, 0); ctx.lineTo(crosshairPos.x, chartH);
      ctx.stroke();
      ctx.setLineDash([]);

      const hoverPrice = yToPrice(crosshairPos.y);
      ctx.fillStyle = '#363a45';
      ctx.fillRect(chartW + 1, crosshairPos.y - 8, axisW - 2, 16);
      ctx.fillStyle = '#fff'; ctx.font = '10px monospace';
      ctx.fillText(hoverPrice.toFixed(spec.decimals), chartW + 4, crosshairPos.y + 3.5);

      const hoverIdx = Math.max(0, Math.min(currentIndex, xToIdx(crosshairPos.x)));
      if (candles[hoverIdx]) {
        const tStr = formatDateTime(candles[hoverIdx].time);
        ctx.fillStyle = '#363a45';
        ctx.fillRect(crosshairPos.x - 32, chartH + 1, 64, 18);
        ctx.fillStyle = '#fff'; ctx.font = '9px sans-serif';
        ctx.fillText(tStr, crosshairPos.x - 28, chartH + 13);
      }
    }
  }

  function drawShape(d, chartW, chartH, spec) {
    const x1 = timeToX(d.t1), x2 = timeToX(d.t2);
    const y1 = priceToY(d.p1), y2 = priceToY(d.p2);

    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, chartW, chartH); ctx.clip();

    if (d.tool === 'hline') {
      ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, y2); ctx.lineTo(chartW, y2); ctx.stroke();
      ctx.fillStyle = '#06b6d4'; ctx.font = '10px monospace';
      ctx.fillText(d.p2.toFixed(spec.decimals), 6, y2 - 4);
    } else if (d.tool === 'trend') {
      ctx.strokeStyle = '#eab308'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    } else if (d.tool === 'ray') {
      ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2;
      const dx = x2 - x1, dy = y2 - y1;
      if (Math.abs(dx) < 1) {
        ctx.beginPath(); ctx.moveTo(x1, 0); ctx.lineTo(x1, chartH); ctx.stroke();
      } else {
        const slope = dy / dx;
        ctx.beginPath();
        ctx.moveTo(0, y1 - slope * x1);
        ctx.lineTo(chartW, y1 + slope * (chartW - x1));
        ctx.stroke();
      }
    } else if (d.tool === 'box') {
      const left = Math.min(x1, x2), top = Math.min(y1, y2);
      const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
      ctx.fillStyle = 'rgba(234, 179, 8, 0.16)'; ctx.strokeStyle = '#eab308'; ctx.lineWidth = 1.3;
      ctx.fillRect(left, top, w, h);
      ctx.strokeRect(left, top, w, h);

      // จุดจับมุมกล่อง 4 มุม (เหมือนในรูปที่ 2)
      [[left, top], [left + w, top], [left, top + h], [left + w, top + h]].forEach(([cx, cy]) => {
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2962ff'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      });
    } else if (d.tool === 'fib') {
      const levels = [0, 0.382, 0.5, 0.618, 0.786, 1];
      const left = Math.min(x1, x2), width = Math.max(60, Math.abs(x2 - x1));
      levels.forEach(lvl => {
        const p = d.p1 + (d.p2 - d.p1) * lvl;
        const y = priceToY(p);
        ctx.strokeStyle = (lvl === 0.618 || lvl === 0.5) ? '#f59e0b' : 'rgba(148,163,184,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + width, y); ctx.stroke();
        ctx.fillStyle = '#d1d4dc'; ctx.font = '9px monospace';
        ctx.fillText(`${lvl} (${p.toFixed(spec.decimals)})`, left + 3, y - 2);
      });
    } else if (d.tool === 'long' || d.tool === 'short') {
      const yEntry = priceToY(d.midP);
      const ySL = priceToY(d.p1);
      const yTP = priceToY(d.p2);
      const left = Math.min(x1, x2);
      const right = Math.max(x1, x2, left + 65);
      const w = right - left;

      ctx.fillStyle = 'rgba(8, 153, 129, 0.28)';
      ctx.fillRect(left, Math.min(yEntry, yTP), w, Math.abs(yTP - yEntry));
      ctx.strokeStyle = '#089981'; ctx.lineWidth = 1.2;
      ctx.strokeRect(left, Math.min(yEntry, yTP), w, Math.abs(yTP - yEntry));

      ctx.fillStyle = 'rgba(242, 54, 69, 0.28)';
      ctx.fillRect(left, Math.min(yEntry, ySL), w, Math.abs(ySL - yEntry));
      ctx.strokeStyle = '#f23645'; ctx.lineWidth = 1.2;
      ctx.strokeRect(left, Math.min(yEntry, ySL), w, Math.abs(ySL - yEntry));

      const riskDiff = Math.abs(d.midP - d.p1);
      const rewardDiff = Math.abs(d.p2 - d.midP);
      const rr = riskDiff > 0 ? (rewardDiff / riskDiff).toFixed(2) : '0.00';
      const tpMoney = (rewardDiff * spec.contractSize * lotSize).toFixed(0);
      const slMoney = (riskDiff * spec.contractSize * lotSize).toFixed(0);

      ctx.fillStyle = '#089981';
      ctx.fillRect(left + 4, yTP - 15, Math.min(w - 8, 110), 14);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif';
      ctx.fillText(`TP: +$${tpMoney} (${rewardDiff.toFixed(spec.decimals)})`, left + 7, yTP - 5);

      ctx.fillStyle = '#1e222d';
      ctx.fillRect(left + 4, yEntry - 8, Math.min(w - 8, 95), 16);
      ctx.fillStyle = '#fff';
      ctx.fillText(`RR 1 : ${rr}`, left + 8, yEntry + 3);

      ctx.fillStyle = '#f23645';
      ctx.fillRect(left + 4, ySL + 1, Math.min(w - 8, 110), 14);
      ctx.fillStyle = '#fff';
      ctx.fillText(`SL: -$${slMoney} (${riskDiff.toFixed(spec.decimals)})`, left + 7, ySL + 11);

      const handles = [
        { x: left + w / 2, y: yTP, color: '#089981' },
        { x: left + w / 2, y: ySL, color: '#f23645' },
        { x: left, y: yEntry, color: '#2962ff' },
        { x: right, y: yEntry, color: '#ffffff' }
      ];
      handles.forEach(h => {
        ctx.fillStyle = h.color;
        ctx.beginPath(); ctx.arc(h.x, h.y, 5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
      });
    }
    ctx.restore();
  }

  function drawLinePath(pts, color) {
    if (pts.length < 2) return;
    ctx.strokeStyle = color; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
  }

  function drawOrderTag(price, label, color, dashed, showX) {
    const y = priceToY(price);
    if (y < -15 || y > chartBounds.chartH + 15) return;
    if (dashed) ctx.setLineDash([4, 4]);
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartBounds.chartW, y); ctx.stroke();
    ctx.setLineDash([]);

    ctx.font = 'bold 10px sans-serif';
    const textW = ctx.measureText(label).width + (showX ? 24 : 12);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(8, y - 9, textW, 18, 4); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(showX ? `${label}  ✕` : label, 14, y + 3.5);
  }

  // =========================================================================
  // Natural TradingView Touch & Mouse Gesture Engine
  // =========================================================================
  let pointerMode = null;
  let draggingOrder = null;
  let lastPointer = { x: 0, y: 0 };
  let initialPinchDist = null;
  let initialVisibleBars = visibleBars;

  function getLocalPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      initialPinchDist = Math.hypot(dx, dy);
      initialVisibleBars = visibleBars;
      pointerMode = 'pinch';
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && initialPinchDist) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const scale = initialPinchDist / Math.max(10, dist);
      visibleBars = Math.max(12, Math.min(250, initialVisibleBars * scale));
      render();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => { initialPinchDist = null; });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const zoomFactor = e.deltaY > 0 ? 1.12 : 0.88;
    visibleBars = Math.max(12, Math.min(250, visibleBars * zoomFactor));
    render();
  }, { passive: false });

  canvas.addEventListener('dblclick', e => {
    const pos = getLocalPos(e.clientX, e.clientY);
    if (pos.x >= chartBounds.chartW) {
      autoScaleY = true; yScaleZoom = 1.0; yPanOffset = 0.0; render();
    }
  });

  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' && !e.isPrimary) return;
    const pos = getLocalPos(e.clientX, e.clientY);
    lastPointer = pos;

    if (pos.x >= chartBounds.chartW) {
      pointerMode = 'scaleY';
      autoScaleY = false;
      return;
    }

    if (selectedTool === 'cut') {
      const clickedCandleIdx = Math.max(5, Math.min(candles.length - 1, xToIdx(pos.x)));
      const targetTs = candles[clickedCandleIdx].time;
      const found1m = base1mCandles.findIndex(c => c.time >= targetTs);
      if (found1m > 5) {
        current1mIndex = found1m;
        rebuildTimeframeCandles();
      }
      setTool('cursor');
      render(); updateUI();
      return;
    }

    if (selectedTool === 'crosshair') {
      crosshairPos = pos;
      pointerMode = 'crosshair';
      render();
      return;
    }

    if (selectedTool === 'cursor') {
      for (let i = drawings.length - 1; i >= 0; i--) {
        const d = drawings[i];
        if (d.tool === 'long' || d.tool === 'short') {
          const x1 = timeToX(d.t1), x2 = timeToX(d.t2);
          const left = Math.min(x1, x2), right = Math.max(x1, x2, left + 65);
          const midX = (left + right) / 2;
          const yTP = priceToY(d.p2), ySL = priceToY(d.p1), yEntry = priceToY(d.midP);

          if (Math.hypot(pos.x - midX, pos.y - yTP) < 18) {
            pointerMode = 'dragRRHandle'; draggingHandle = { drawIdx: i, handle: 'tp' }; return;
          }
          if (Math.hypot(pos.x - midX, pos.y - ySL) < 18) {
            pointerMode = 'dragRRHandle'; draggingHandle = { drawIdx: i, handle: 'sl' }; return;
          }
          if (Math.hypot(pos.x - left, pos.y - yEntry) < 18) {
            pointerMode = 'dragRRHandle'; draggingHandle = { drawIdx: i, handle: 'entry' }; return;
          }
          if (Math.hypot(pos.x - right, pos.y - yEntry) < 18) {
            pointerMode = 'dragRRHandle'; draggingHandle = { drawIdx: i, handle: 'resizeRight' }; return;
          }
        }
      }

      for (let i = orders.length - 1; i >= 0; i--) {
        const o = orders[i];
        const yEntry = priceToY(o.entry);
        if (Math.abs(pos.y - yEntry) < 14) {
          if (pos.x > 75 && pos.x < 165) {
            orders.splice(i, 1); render(); updateUI(); return;
          }
          if (!o.triggered) {
            pointerMode = 'dragOrder'; draggingOrder = { idx: i, field: 'entry' }; return;
          }
        }
        if (o.sl && Math.abs(pos.y - priceToY(o.sl)) < 14) {
          pointerMode = 'dragOrder'; draggingOrder = { idx: i, field: 'sl' }; return;
        }
        if (o.tp && Math.abs(pos.y - priceToY(o.tp)) < 14) {
          pointerMode = 'dragOrder'; draggingOrder = { idx: i, field: 'tp' }; return;
        }
      }

      pointerMode = 'panChart';
      return;
    }

    pointerMode = 'draw';
    const t1 = xToTime(pos.x), p1 = yToPrice(pos.y);
    activeDrawing = { tool: selectedTool, t1, t2: t1, p1, p2: p1, midP: p1 };
  });

  canvas.addEventListener('pointermove', e => {
    const pos = getLocalPos(e.clientX, e.clientY);
    const dx = pos.x - lastPointer.x;
    const dy = pos.y - lastPointer.y;
    lastPointer = pos;

    if (pointerMode === 'scaleY') {
      const factor = 1 - dy * 0.008;
      yScaleZoom = Math.max(0.15, Math.min(8.0, yScaleZoom * factor));
      render();
    } else if (pointerMode === 'panChart') {
      // ลากนิ้วไปทางซ้าย (dx < 0) -> เปิดดูอนาคตทางขวา, ลากนิ้วไปทางขวา (dx > 0) -> ย้อนดูอดีตทางซ้าย
      rightOffsetBars -= dx / chartBounds.stepX;
      rightOffsetBars = Math.max(-currentIndex + 8, Math.min(visibleBars - 5, rightOffsetBars));

      if (!autoScaleY) {
        const pricePerPx = (chartBounds.max - chartBounds.min) / chartBounds.chartH;
        yPanOffset += dy * pricePerPx;
      }
      render();
    } else if (pointerMode === 'crosshair') {
      crosshairPos = pos;
      render();
    } else if (pointerMode === 'dragOrder' && draggingOrder) {
      orders[draggingOrder.idx][draggingOrder.field] = yToPrice(pos.y);
      render();
    } else if (pointerMode === 'dragRRHandle' && draggingHandle) {
      const d = drawings[draggingHandle.drawIdx];
      if (draggingHandle.handle === 'tp') d.p2 = yToPrice(pos.y);
      else if (draggingHandle.handle === 'sl') d.p1 = yToPrice(pos.y);
      else if (draggingHandle.handle === 'entry') {
        const newMid = yToPrice(pos.y);
        const shift = newMid - d.midP;
        d.midP = newMid; d.p1 += shift; d.p2 += shift;
      } else if (draggingHandle.handle === 'resizeRight') {
        d.t2 = Math.max(d.t1 + timeframeMin * 60000 * 3, xToTime(pos.x));
      }
      render();
    } else if (pointerMode === 'draw' && activeDrawing) {
      activeDrawing.t2 = xToTime(pos.x);
      activeDrawing.p2 = yToPrice(pos.y);
      if (activeDrawing.tool === 'long') {
        const r = Math.abs(activeDrawing.p1 - activeDrawing.p2);
        activeDrawing.p2 = activeDrawing.p1 + r * 2;
        activeDrawing.p1 = yToPrice(pos.y);
      } else if (activeDrawing.tool === 'short') {
        const r = Math.abs(activeDrawing.p2 - activeDrawing.p1);
        activeDrawing.p2 = activeDrawing.p1 - r * 2;
        activeDrawing.p1 = yToPrice(pos.y);
      }
      render();
    }
  });

  window.addEventListener('pointerup', () => {
    if (pointerMode === 'draw' && activeDrawing) {
      if ((activeDrawing.tool === 'long' || activeDrawing.tool === 'short') && Math.abs(activeDrawing.t2 - activeDrawing.t1) < timeframeMin * 60000 * 4) {
        activeDrawing.t2 = activeDrawing.t1 + timeframeMin * 60000 * 10;
      }
      drawings.push(activeDrawing);
      activeDrawing = null;
      setTool('cursor');
      render();
    }
    pointerMode = null;
    draggingOrder = null;
    draggingHandle = null;
  });

  // Simulation Step
  function stepForward() {
    const stepMinutes = Math.max(1, timeframeMin);
    if (current1mIndex + stepMinutes >= base1mCandles.length) {
      stopPlay();
      return;
    }

    const spec = SYMBOLS[currentSymbol];
    for (let m = 1; m <= stepMinutes; m++) {
      const bar1m = base1mCandles[current1mIndex + m];
      if (!bar1m) break;

      const remaining = [];
      for (const o of orders) {
        if (!o.triggered) {
          if (o.type === 'BUY LIMIT' && bar1m.low <= o.entry) o.triggered = true;
          else if (o.type === 'SELL LIMIT' && bar1m.high >= o.entry) o.triggered = true;
          else if (o.type === 'BUY STOP' && bar1m.high >= o.entry) o.triggered = true;
          else if (o.type === 'SELL STOP' && bar1m.low <= o.entry) o.triggered = true;
        }
        if (o.triggered) {
          const isBuy = o.type.includes('BUY');
          let exitP = null, reason = '';
          if (isBuy) {
            if (o.sl && bar1m.low <= o.sl) { exitP = o.sl; reason = 'SL'; }
            else if (o.tp && bar1m.high >= o.tp) { exitP = o.tp; reason = 'TP'; }
          } else {
            if (o.sl && bar1m.high >= o.sl) { exitP = o.sl; reason = 'SL'; }
            else if (o.tp && bar1m.low <= o.tp) { exitP = o.tp; reason = 'TP'; }
          }
          if (exitP !== null) {
            const pnl = (isBuy ? exitP - o.entry : o.entry - exitP) * spec.contractSize * o.lot;
            balance += pnl;
            history.unshift({ type: o.type, entry: o.entry, exit: exitP, pnl, reason });
            continue;
          }
        }
        remaining.push(o);
      }
      orders = remaining;
    }

    current1mIndex += stepMinutes;
    rebuildTimeframeCandles();
    render();
    updateUI();
  }

  function startPlay() {
    if (isPlaying) return;
    isPlaying = true;
    const btn = document.getElementById('playBtn');
    btn.textContent = '⏸ Pause'; btn.className = 'btn btn-orange';
    playTimer = setInterval(stepForward, speedMs);
  }
  function stopPlay() {
    isPlaying = false;
    clearInterval(playTimer);
    const btn = document.getElementById('playBtn');
    btn.textContent = '▶ Play'; btn.className = 'btn btn-green';
  }

  function updateUI() {
    const spec = SYMBOLS[currentSymbol];
    const curPrice = candles[currentIndex]?.close || 0;
    let floating = 0;
    orders.forEach(o => {
      if (o.triggered) {
        const isBuy = o.type.includes('BUY');
        floating += (isBuy ? curPrice - o.entry : o.entry - curPrice) * spec.contractSize * o.lot;
      }
    });
    const eq = balance + floating;
    document.getElementById('balText').textContent = `$${balance.toFixed(2)}`;
    const eqEl = document.getElementById('eqText');
    eqEl.textContent = `$${eq.toFixed(2)}`;
    eqEl.style.color = eq >= balance ? 'var(--green)' : 'var(--red)';

    const wins = history.filter(h => h.pnl > 0).length;
    const winRate = history.length ? ((wins / history.length) * 100).toFixed(0) : 0;
    document.getElementById('winRateText').textContent = `${winRate}% (${wins}/${history.length})`;
    document.getElementById('activeCount').textContent = orders.length;
    document.getElementById('histCount').textContent = history.length;

    const list = document.getElementById('listArea');
    if (activeTab === 'active') {
      list.innerHTML = orders.map(o => {
        const isBuy = o.type.includes('BUY');
        const pnl = o.triggered ? (isBuy ? curPrice - o.entry : o.entry - curPrice) * spec.contractSize * o.lot : 0;
        return `<div class="order-row">
          <div><b style="color:${isBuy ? 'var(--blue)' : 'var(--purple)'}">${o.type}</b> ${o.lot.toFixed(2)} @ ${o.entry.toFixed(spec.decimals)}</div>
          <div>${o.triggered ? `<b style="color:${pnl >= 0 ? 'var(--green)' : 'var(--red)'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</b>` : '<span style="color:var(--yellow)">PENDING</span>'}</div>
        </div>`;
      }).join('') || '<div style="color:var(--muted);text-align:center;margin-top:15px;">ไม่มีออเดอร์ (กด Place หรือวาดกล่อง RR แล้วลากปรับได้)</div>';
    } else {
      list.innerHTML = history.map(h => `
        <div class="order-row">
          <div><b>${h.type}</b> (${h.reason}) ${h.entry.toFixed(spec.decimals)} → ${h.exit.toFixed(spec.decimals)}</div>
          <b style="color:${h.pnl >= 0 ? 'var(--green)' : 'var(--red)'}">${h.pnl >= 0 ? '+' : ''}$${h.pnl.toFixed(2)}</b>
        </div>
      `).join('') || '<div style="color:var(--muted);text-align:center;margin-top:15px;">ยังไม่มีประวัติการปิดออเดอร์</div>';
    }
  }

  // Controls Binding
  document.getElementById('symbolSelect').onchange = e => {
    currentSymbol = e.target.value;
    document.getElementById('anchorPriceInput').value = SYMBOLS[currentSymbol].defaultPrice;
    syncMarketData(true);
  };

  dateInput.onchange = e => {
    const parsed = Date.parse(e.target.value);
    if (!isNaN(parsed)) {
      startDateMs = parsed;
      syncMarketData(false);
    }
  };

  document.getElementById('applyPriceBtn').onclick = () => syncMarketData(false);
  document.getElementById('syncLiveBtn').onclick = () => syncMarketData(true);

  document.getElementById('autoFitBtn').onclick = () => {
    autoScaleY = true; yScaleZoom = 1.0; yPanOffset = 0.0; rightOffsetBars = 12; render();
  };

  document.getElementById('applyBalBtn').onclick = () => {
    const val = parseFloat(document.getElementById('initBalInput').value);
    if (!isNaN(val) && val > 0) {
      initialBalance = val;
      resetSessionState();
    }
  };

  document.getElementById('playBtn').onclick = () => isPlaying ? stopPlay() : startPlay();
  document.getElementById('stepBtn').onclick = () => { stopPlay(); stepForward(); };
  document.getElementById('speedSelect').onchange = e => {
    speedMs = Number(e.target.value);
    if (isPlaying) { stopPlay(); startPlay(); }
  };
  document.getElementById('progressSlider').oninput = e => {
    current1mIndex = Number(e.target.value);
    rebuildTimeframeCandles();
    render(); updateUI();
  };

  document.getElementById('lotMinus').onclick = () => {
    lotSize = Math.max(0.01, +(lotSize - 0.05).toFixed(2));
    document.getElementById('lotText').textContent = lotSize.toFixed(2);
    render();
  };
  document.getElementById('lotPlus').onclick = () => {
    lotSize = +(lotSize + 0.05).toFixed(2);
    document.getElementById('lotText').textContent = lotSize.toFixed(2);
    render();
  };
  document.getElementById('riskSelect').onchange = e => { riskPercent = Number(e.target.value); };

  document.querySelectorAll('#orderTypeGroup .btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#orderTypeGroup .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedOrderType = btn.dataset.type;
      const pBtn = document.getElementById('placeOrderBtn');
      pBtn.textContent = `Place ${selectedOrderType}`;
      pBtn.className = `btn ${selectedOrderType.includes('BUY') ? 'btn-blue' : 'btn-red'}`;
    };
  });

  document.getElementById('placeOrderBtn').onclick = () => {
    const spec = SYMBOLS[currentSymbol];
    const price = candles[currentIndex]?.close || spec.defaultPrice;
    const isBuy = selectedOrderType.includes('BUY');
    let entry = price, triggered = false;

    if (selectedOrderType === 'BUY') { entry = price + spec.spread; triggered = true; }
    else if (selectedOrderType === 'SELL') { entry = price; triggered = true; }
    else if (selectedOrderType === 'BUY LIMIT') entry = price - spec.defaultSL * 0.7;
    else if (selectedOrderType === 'SELL LIMIT') entry = price + spec.defaultSL * 0.7;
    else if (selectedOrderType === 'BUY STOP') entry = price + spec.defaultSL * 0.7;
    else if (selectedOrderType === 'SELL STOP') entry = price - spec.defaultSL * 0.7;

    let finalLot = lotSize;
    if (riskPercent > 0) {
      const riskDollars = balance * (riskPercent / 100);
      finalLot = Math.max(0.01, +(riskDollars / (spec.defaultSL * spec.contractSize)).toFixed(2));
    }

    orders.push({
      id: Date.now(), type: selectedOrderType, triggered, entry,
      sl: isBuy ? entry - spec.defaultSL : entry + spec.defaultSL,
      tp: isBuy ? entry + spec.defaultTP : entry - spec.defaultTP,
      lot: finalLot
    });
    render(); updateUI();
  };

  document.getElementById('closeAllBtn').onclick = () => {
    const spec = SYMBOLS[currentSymbol];
    const cur = candles[currentIndex]?.close || 0;
    orders = orders.filter(o => {
      if (!o.triggered) return true;
      const isBuy = o.type.includes('BUY');
      const pnl = (isBuy ? cur - o.entry : o.entry - cur) * spec.contractSize * o.lot;
      balance += pnl;
      history.unshift({ type: o.type, entry: o.entry, exit: cur, pnl, reason: 'Manual' });
      return false;
    });
    render(); updateUI();
  };

  function setTool(t) {
    selectedTool = t;
    if (t !== 'crosshair') crosshairPos = null;
    document.querySelectorAll('#toolGroup .tool-btn[data-tool]').forEach(b => {
      b.classList.toggle('active', b.dataset.tool === t);
    });
    render();
  }
  document.querySelectorAll('#toolGroup .tool-btn[data-tool]').forEach(b => {
    b.onclick = () => setTool(b.dataset.tool);
  });
  document.getElementById('undoDrawBtn').onclick = () => { drawings.pop(); render(); };
  document.getElementById('clearDrawBtn').onclick = () => { drawings = []; render(); };

  document.querySelectorAll('#tfGroup .btn[data-min]').forEach(b => {
    b.onclick = () => {
      document.querySelectorAll('#tfGroup .btn[data-min]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      timeframeMin = Number(b.dataset.min);
      rebuildTimeframeCandles();
      render();
    };
  });

  document.getElementById('tabActive').onclick = () => {
    activeTab = 'active';
    document.getElementById('tabActive').classList.add('active');
    document.getElementById('tabHistory').classList.remove('active');
    updateUI();
  };
  document.getElementById('tabHistory').onclick = () => {
    activeTab = 'history';
    document.getElementById('tabHistory').classList.add('active');
    document.getElementById('tabActive').classList.remove('active');
    updateUI();
  };

  // CSV Importer (รองรับไฟล์ M1 ที่ Export จาก MetaTrader 4 / MetaTrader 5 โดยตรง)
  document.getElementById('csvInput').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const lines = ev.target.result.split(/\r?\n/);
      const parsed = [];
      for (const line of lines) {
        const c = line.split(/[,;\t]/);
        if (c.length >= 6 && !isNaN(parseFloat(c[2]))) {
          const dt = Date.parse(`${c[0].replace(/\./g, '-')}T${c[1] || '00:00'}:00Z`);
          parsed.push({
            time: isNaN(dt) ? (Date.now() + parsed.length * 60000) : dt,
            open: parseFloat(c[2]), high: parseFloat(c[3]),
            low: parseFloat(c[4]), close: parseFloat(c[5])
          });
        }
      }
      if (parsed.length > 20) {
        base1mCandles = parsed;
        current1mIndex = Math.min(200, base1mCandles.length - 1);
        document.getElementById('anchorPriceInput').value = parsed[parsed.length - 1].close.toFixed(3);
        resetSessionState();
      }
    };
    reader.readAsText(file);
  };

  window.addEventListener('resize', render);
  syncMarketData(true);
})();
</script>
</body>
</html>
